<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidequest</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <a class="logo" href="./index.html">sidequest ✦</a>
    <button type="button" id="create-button">+ Make a plan</button>
  </header>

  <main>
    <h1>Your circle</h1>
    <p class="subtitle">Good people. Small plans. A little closer.</p>

    <section class="feed" aria-label="Friends’ plans">
      <article class="post">
        <p class="author">Maya Chen · Close friends</p>
        <h2>Dinner, anyone?</h2>
        <p>Trying a new recipe tonight. Come cook with me.</p>

        <div class="post-footer">
          <span>Tonight · In person</span>
          <button type="button">Ask to join</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
